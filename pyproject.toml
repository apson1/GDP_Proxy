[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gdp-proxy"
version = "0.1.0"
description = "Subnational GDP estimation from VIIRS nighttime lights"
requires-python = ">=3.11"
dependencies = [
    "earthengine-api>=1.4",
    "geemap>=0.35",
    "geopandas>=1.0",
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "statsmodels>=0.14",
    "linearmodels>=6.0",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "streamlit>=1.38",
    "pydeck>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
gdp-proxy-doctor = "gdp_proxy.doctor:main"
gdp-proxy-boundaries = "gdp_proxy.boundaries:main"
gdp-proxy-extract = "gdp_proxy.extract:main"
gdp-proxy-labels = "gdp_proxy.labels:main"
gdp-proxy-match = "gdp_proxy.match:main"
gdp-proxy-features = "gdp_proxy.features:main"
gdp-proxy-model = "gdp_proxy.model:main"
gdp-proxy-evaluate = "gdp_proxy.evaluate:main"
gdp-proxy-pipeline = "gdp_proxy.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# UP017 wants datetime.UTC, which is 3.11+ only. timezone.utc keeps the code
# runnable on 3.10 CI runners and is equivalent.
ignore = ["UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: requires Earth Engine or internet access",
    "needs_data: requires a data artefact not committed to the repo",
]
